<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthetic Haier frontend fixture</title>
<style>
  :root { --primary-text-color:#18232d; --secondary-text-color:#52616e; --primary-color:#006fbd; --error-color:#b21930; --divider-color:#c4cbd1; --secondary-background-color:#eef1f4; --card-background-color:#fff; --primary-background-color:#f5f7f9; --text-primary-color:#fff; --paper-font-body1_-_font-family:Arial,sans-serif; }
  body { margin:16px; font:14px/1.45 Arial,sans-serif; background:var(--primary-background-color); color:var(--primary-text-color); }
  main { max-width:680px; margin:auto; display:grid; gap:16px; } .fixture-label { color:var(--secondary-text-color); font-size:12px; }
  body.dark { --primary-text-color:#edf2f7; --secondary-text-color:#b8c5d2; --primary-color:#72b9ff; --error-color:#ff9aab; --divider-color:#52606c; --secondary-background-color:#273542; --card-background-color:#17232e; --primary-background-color:#0d1720; --text-primary-color:#102a43; }
</style>
<home-assistant><main><p class="fixture-label">Synthetic frontend fixture. No appliance connection.</p><haier-laundry-card id="washer"></haier-laundry-card><haier-laundry-card id="dryer"></haier-laundry-card></main></home-assistant>
<script type="module">
  class Icon extends HTMLElement {
    static get observedAttributes() { return ['icon']; }
    constructor() { super(); this.attachShadow({mode:'open'}); }
    connectedCallback() { this.draw(); }
    attributeChangedCallback() { this.draw(); }
    draw() {
      const icon=this.getAttribute('icon')||'';
      const path=icon.includes('pause')?'M6 4h4v16H6zm8 0h4v16h-4z':icon.includes('play')?'M8 4v16l12-8z':icon.includes('close')?'M6 5 5 6l6 6-6 6 1 1 6-6 6 6 1-1-6-6 6-6-1-1-6 6z':icon.includes('chevron')?'M5 9 12 16 19 9 17 7 12 12 7 7z':'M4 3h16v18H4zm2 2v3h12V5zm6 5a4 4 0 1 0 0 8 4 4 0 0 0 0-8';
      this.shadowRoot.innerHTML=`<style>:host{display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);flex-shrink:0}svg{width:100%;height:100%;fill:currentColor}</style><svg aria-hidden="true" viewBox="0 0 24 24"><path d="${path}"/></svg>`;
    }
  }
  customElements.define('ha-icon',Icon);
  customElements.define('home-assistant',class extends HTMLElement {});
  customElements.define('ha-card',class extends HTMLElement {});
  const lang=new URL(location.href).searchParams.get('lang')||'ru';
  const entries={},states={},listeners=new Set();
  const catalog=[{title:'Ткани',description:'Программы из облака',programs:[
    {option:'Смешанная',name:'Смешанная',description:'Для повседневной одежды',duration:'44 минуты'},
    {option:'Хлопок',name:'Хлопок',description:'Для хлопковых тканей',duration:'80 минут'},
  ]},{title:'Особые программы',description:'Дополнительные режимы',programs:[{option:'Очень длинное название программы для проверки переноса текста',name:'Очень длинное название программы для проверки переноса текста',description:'Полное облачное описание, которое должно переноситься на небольшом экране.',duration:'120 минут'}]}];
  function add(device,domain,suffix,state,attributes={}) {
    const id=`${domain}.${device}_${suffix}`;
    entries[id]={entity_id:id,device_id:device,platform:'haier_evo',unique_id:`fixture_${device}_${suffix}`};
    states[id]={entity_id:id,state,attributes};return id;
  }
  for(const device of ['washer','dryer']) {
    add(device,'sensor','state','idle',{friendly_name:device==='washer'?'Стиральная машина':'Сушильная машина'});
    add(device,'sensor','phase','Этап 0');add(device,'sensor','program','Смешанная');add(device,'sensor','remaining_time','17');
    add(device,'binary_sensor','remote_control','on');add(device,'binary_sensor','child_lock','off');
    for(const action of ['start','pause','resume','cancel'])add(device,'button',`laundry_${action}`,'unknown');
    add(device,'select','laundry_program','Смешанная',{
      options:catalog.flatMap(g=>g.programs.map(p=>p.option)),program_catalog:catalog,
      program_settings:{program:'Смешанная',fields:[{key:'temp',title:'Температура',kind:'select',value:'30',options:[{value:'30',label:'30 °C'},{value:'auto',label_key:'automatic',description_key:'forced_parameter'}]},{key:'time',title:'Время',kind:'number',value:'20',min:5,max:120,step:5,unit:'min',description_key:'schedule_readonly'}]},
      active_program_details:{program:'Смешанная',remaining_minutes:17,total_minutes:44,fields:[{key:'temp',title:'Температура',value:'30 °C',description:'Из облака'},{key:'feature',title:'Дополнительная функция',value_key:'off',value:'false'}]},
    });
  }
  window.wsCalls=[];window.serviceCalls=[];window.nativeEvents=[];
  const hass=window.demoHass={language:lang,states,entities:entries,devices:{washer:{name:'Стиральная машина'},dryer:{name:'Сушильная машина'}},services:{haier_evo:{configure_program:{}}},
    localize:(key)=>key.endsWith('.laundry_parameters_missing_schema.message')?(lang==='ru'?'Параметры этой программы недоступны':'The program settings are unavailable'):undefined,
    async callWS(request){window.wsCalls.push(request);if(window.failLookup)throw Error('Synthetic lookup failure');
      if(request.type==='config/entity_registry/get')return entries[request.entity_id];
      if(request.type==='config/entity_registry/get_entries')return Object.fromEntries(request.entity_ids.map(id=>[id,entries[id]||null]));
      if(request.type==='config/entity_registry/list_for_display')return {entities:Object.values(entries).map(e=>({ei:e.entity_id,di:e.device_id}))};
      throw Error(`Forbidden registry request: ${request.type}`);
    },
    async callService(domain,service,data){window.serviceCalls.push([domain,service,data]);if(window.failService)throw Error('Synthetic service error');},
    connection:{async subscribeEvents(callback,type){if(type!=='state_changed')throw Error('Unexpected subscription');listeners.add(callback);return ()=>listeners.delete(callback);}},
  };
  const root=document.querySelector('home-assistant');root.hass=hass;
  window.listenerCount=()=>listeners.size;
  window.updateState=(id,state)=>{states[id]={...states[id],state};for(const card of document.querySelectorAll('haier-laundry-card'))card.hass=hass;for(const callback of listeners)callback({data:{entity_id:id,new_state:states[id]}});};
  root.addEventListener('hass-more-info',event=>window.nativeEvents.push(event.detail));
  const mode=new URL(location.href).searchParams.get('mode');
  await import('../haier-laundry-ui.js'+(mode==='more'?'?more_info=sensor.washer_state':''));
  for(const device of ['washer','dryer']){
    const card=document.getElementById(device);card.setConfig({entity:`sensor.${device}_state`,name:hass.devices[device].name,kind:device==='dryer'?'dryer':'washer'});card.hass=hass;
  }
  window.fixtureReady=true;
</script>
</html>
